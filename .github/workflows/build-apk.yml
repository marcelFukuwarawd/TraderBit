```yaml
name: Compilar BTC Trader Sim APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerar estrutura completa do app Android
        run: python3 setup_project.py

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceitar licencas Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Final
        run: gradle assembleRelease --no-daemon

      - name: Preparar arquivo APK final
        run: cp app/build/outputs/apk/release/app-release.apk BTC-Trader-Sim-Final.apk

      - name: Publicar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: BTC-Trader-Sim-Final-APK
          path: BTC-Trader-Sim-Final.apk
          retention-days: 90
```

